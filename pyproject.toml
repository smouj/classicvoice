[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classicvoice"
version = "0.4.0"
description = "Offline multilingual text-to-speech desktop app with classic and natural voices, chapter workflows, and WAV export."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "smouj"}]
keywords = ["tts", "espeak-ng", "offline", "multilingual", "desktop"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
urls = {Homepage = "https://github.com/smouj/classicvoice", Repository = "https://github.com/smouj/classicvoice", Issues = "https://github.com/smouj/classicvoice/issues", Changelog = "https://github.com/smouj/classicvoice/blob/main/CHANGELOG.md"}

[project.scripts]
classicvoice = "classicvoice.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.13,<7"]
test = ["pytest>=8,<10"]
natural = [
  "kokoro-onnx==0.6.1",
  "espeakng-loader==0.2.4",
  "numpy==2.4.6",
  "onnxruntime==1.31.0",
  "phonemizer==3.4.0",
  "flatbuffers==25.12.19",
  "packaging==26.3",
  "protobuf==7.36.2",
  "attrs==26.1.0",
  "cffi==2.1.1",
  "cloudpickle==3.1.2",
  "dlinfo==2.0.0",
  "joblib==1.6.0",
  "typing_extensions==4.16.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
