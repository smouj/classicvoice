[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classicvoice"
version = "0.2.2"
description = "Local-first Spanish text-to-speech desktop app with classic eSpeak NG voices."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "smouj"}]
keywords = ["tts", "espeak-ng", "offline", "spanish", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
urls = {Homepage = "https://github.com/smouj/classicvoice", Repository = "https://github.com/smouj/classicvoice", Issues = "https://github.com/smouj/classicvoice/issues", Changelog = "https://github.com/smouj/classicvoice/blob/main/CHANGELOG.md"}

[project.scripts]
classicvoice = "classicvoice.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.13,<7"]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
