[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classicvoice"
version = "0.1.0"
description = "Minimal offline desktop front-end for classic-style Spanish TTS with eSpeak NG."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SMOUJ013"}]
keywords = ["tts", "espeak-ng", "offline", "spanish", "local-first"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.scripts]
classicvoice = "classicvoice.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
