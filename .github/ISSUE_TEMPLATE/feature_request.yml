name: Proponer una mejora
description: Sugiere una mejora concreta para ClassicVoice.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Necesidad
      description: ¿Qué tarea te cuesta hacer con ClassicVoice?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Propuesta
      description: Describe cómo debería ayudarte la mejora.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Alcance del producto
      options:
        - label: Entiendo que ClassicVoice prioriza la síntesis local y el flujo texto a voz WAV.
          required: true
