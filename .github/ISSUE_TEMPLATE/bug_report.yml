name: Bug report
description: Report a reproducible ClassicVoice problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: input
    id: espeak
    attributes:
      label: eSpeak NG version
