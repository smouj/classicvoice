name: Informar de un error
description: Describe un fallo reproducible de ClassicVoice.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |-
        No incluyas texto privado, WAV personales, contraseñas ni datos de cuenta.
  - type: input
    id: version
    attributes:
      label: Versión de ClassicVoice
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11 24H2, 64 bits
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      description: No pegues texto sensible utilizado en la app.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que ocurriera
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Qué ocurrió
    validations:
      required: true
